# Single public entry point: static SPA + reverse proxy to the API (which is not published separately).
map $http_x_forwarded_proto $hsts_value {
  default "";
  https "max-age=31536000; includeSubDomains";
}
server {
  listen 80;
  server_tokens off;
  client_max_body_size 20m;
  client_body_timeout 30s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # React style attributes need 'unsafe-inline' for styles only; scripts are same-origin only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # HSTS only when the TLS-terminating proxy in front reports https
  add_header Strict-Transport-Security $hsts_value always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /health/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://api:8000/health; proxy_set_header Host $host; }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
