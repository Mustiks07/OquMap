[project]
name = "oqumap-api"
version = "0.1.0"
description = "OquMap API: curriculum-linked assessment analytics, comparison of materials and hours planning for methodists"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.4",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.0.44",
  "alembic==1.20.1",
  "psycopg[binary]==3.2.13",
  "ortools==9.15.6755",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "openpyxl==3.1.5",
  "pypdf==7.0.1",
  "python-docx==1.2.0",
  "reportlab==4.4.5",
  "httpx==0.28.1",
  "scipy==1.16.3",
  "pypdfium2==5.0.0",
  "python-multipart==0.0.33",
  "anthropic==2.8.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oqumap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "N806", "B017", "E402"]
